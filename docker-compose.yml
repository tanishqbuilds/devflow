name: devflow

services:

  frontend:
    container_name: devflow-frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BYPASS_AUTH: ${NEXT_PUBLIC_BYPASS_AUTH:-true}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in .env}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL must be set in .env}
        NEXT_PUBLIC_UNLIMITED_CREDENTIALS: ${NEXT_PUBLIC_UNLIMITED_CREDENTIALS:-false}
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in .env}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL must be set in .env}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_BYPASS_AUTH=${NEXT_PUBLIC_BYPASS_AUTH:-true}
      - NEXT_PUBLIC_UNLIMITED_CREDENTIALS=${NEXT_PUBLIC_UNLIMITED_CREDENTIALS:-false}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    container_name: devflow-backend
    build: ./backend
    ports:
      - "${PORT_BACKEND:-8000}:8000"
    volumes:
      - ./backend:/workspace
    env_file:
      - .env
    environment:
      - BYPASS_AUTH=${BYPASS_AUTH:-true}
      - UNLIMITED_CREDENTIALS=${UNLIMITED_CREDENTIALS:-false}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
    depends_on:
      ai-services:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai-services:
    container_name: devflow-ai-services
    build: ./ai-services
    ports:
      - "${PORT_AI:-8001}:8001"
    volumes:
      - ./ai-services:/workspace
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  langflow:
    container_name: devflow-langflow
    image: langflowai/langflow:latest
    ports:
      - "${PORT_LANGFLOW:-7860}:7860"
    environment:
      - LANGFLOW_HOST=0.0.0.0
      - LANGFLOW_PORT=7860
      - LANGFLOW_DO_NOT_TRACK=true
      - LANGFLOW_AUTO_LOGIN=true
      - LANGFLOW_SUPERUSER=langflow
      - LANGFLOW_SUPERUSER_PASSWORD=langflowadmin123
    volumes:
      - langflow_data:/root/.cache/langflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7860/health_check').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  langflow_data:
    name: devflow_langflow_data
